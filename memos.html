<body>
<div id="outer">
<header>
  <div id="header-container">
    <div id="head-inner">
      <div class="header-top">
        <h1>My Website</h1>
        <p class="description">テスト</p>

      <nav class="header-nav">
        <a href="index.html">ホーム</a>

      </nav>

<div id="content-wrapper">
<main>
<div id="inner">
<h2>備忘録</h2>
<section class="bookmark-section">
  <div class="bookmark-box">
    <h3>新しいメモを追加</h3>
    <form id="memo-form" class="bookmark-form memo-form">
      <label>
        タイトル
        <input type="text" id="memo-title" placeholder="メモのタイトル" required>
      </label>
      <label>
        内容
        <textarea id="memo-content" rows="6" placeholder="メモを書き込む"></textarea>
      </label>
      <label>
        タグ（任意）
        <input type="text" id="memo-tags" placeholder="カンマ区切りで入力 (例: 学習, 仕事)">
      </label>
      <div class="memo-related-links">
        <div class="memo-related-links-header">
          <span>関連リンク（任意）</span>
          <button type="button" id="add-memo-link-entry" class="secondary-button">リンクを追加</button>
        </div>
        <div id="memo-related-links-container" class="memo-related-links-container"></div>
      </div>
      <label>
        画像（任意・ファイルまたは貼り付け可）
        <input type="file" id="memo-image" accept="image/*">
      </label>
      <div id="memo-image-preview" class="memo-image-preview"></div>
      <p class="memo-helper">画像は Ctrl+V でも貼り付けできます。</p>
      <button type="submit">メモを保存</button>
    </form>
  </div>
</section>
<section class="bookmark-section">
  <div class="bookmark-box">
    <h3>タグで絞り込み</h3>
    <div class="tag-filter">
      <input type="text" id="memo-tag-filter" placeholder="検索したいタグを入力">
      <div id="memo-tag-buttons" class="tag-buttons"></div>
      <button id="clear-memo-filter" type="button">絞り込み解除</button>
    </div>
  </div>
</section>
<section class="bookmark-section">
  <h3>保存したメモ一覧</h3>
  <div id="memo-list" class="memo-list"></div>
</section>
</div>
</main>
<aside>
<div id="middle-inner">
<div class="side-title">menu</div>
<div class="side">
<ul>
<li>記事ページへのリンク</li>
<li>記事ページへのリンク</li>
</ul>
</div>
</div>
