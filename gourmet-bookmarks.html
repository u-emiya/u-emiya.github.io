<body>
<div id="outer">
<header>

    <div id="head-inner">
      <div class="header-top">
        <h1>My Website</h1>
        <p class="description">テスト</p>

      <nav class="header-nav">

        <a href="auth.html">ログイン</a>
      </nav>
    </div>
  </div>
</header>
<div id="content-wrapper">
<main>
<div id="inner">
<h2>グルメブックマーク</h2>
<section class="bookmark-section">
  <div class="bookmark-box">
    <h3>新しいグルメサイトを追加</h3>
    <form id="bookmark-form" class="bookmark-form">
      <label>
        URL
        <input type="url" id="bookmark-url" placeholder="https://example.com" required>
      </label>
      <label>
        タイトル / 説明
        <input type="text" id="bookmark-title" placeholder="お店やレビュー名を入力">
      </label>
      <label>
        タグ
        <input type="text" id="bookmark-tags" placeholder="カンマで区切る (例: ラーメン, 東京, 行きたい)">
      </label>
      <button type="submit">保存する</button>
    </form>
  </div>
  <div class="bookmark-box">
    <h3>タグで絞り込み</h3>
    <div class="tag-filter">
      <input type="text" id="tag-filter-input" placeholder="検索したいタグを入力">
      <div id="tag-buttons" class="tag-buttons"></div>
      <button id="clear-filter" type="button">絞り込み解除</button>
    </div>
  </div>
</section>
<section class="bookmark-section">
  <h3>保存したグルメサイト一覧</h3>
  <div id="bookmark-list" class="bookmark-list"></div>
</section>
</div>
</main>
<aside>
<div id="middle-inner">
<div class="side-title">menu</div>
<div class="side">
<ul>
<li>記事ページへのリンク</li>
<li>記事ページへのリンク</li>
</ul>
</div>
</div>
</aside>
</div>
<footer>© 2010 あなたのホームページ</footer>
</div>

</script>
<script src="gourmet-bookmarks.js"></script>
</body>
</html>
